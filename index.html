        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);

        margin: 0;
      }

      figcaption {
        margin-bottom: 8px;
        text-align: center;
        font-weight: 700;
        color: #2d4d2b;

      #scene-annotated #annotations {

        stroke: #999;
        stroke-width: 1;

      #scene-annotated #annotations text,
      #scene-annotated #annotations line {
